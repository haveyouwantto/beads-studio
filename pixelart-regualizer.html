<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>像素图自动规范化</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #171717;
            color: #eee;
            font-family: system-ui, sans-serif;
        }

        header {
            padding: 18px 24px;
            background: #222;
            border-bottom: 1px solid #444;
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        .controls {
            padding: 16px 24px;
            background: #202020;
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
        }

        label {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        button {
            padding: 8px 16px;
            border: 0;
            border-radius: 6px;
            background: #3b82f6;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        select {
            background: #111;
            color: white;
            border: 1px solid #555;
            padding: 7px;
        }

        #status {
            color: #9ca3af;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 16px;
            padding: 16px;
        }

        .panel {
            background: #252525;
            border-radius: 12px;
            padding: 14px;
            overflow: hidden;
        }

        .panel h2 {
            margin-top: 0;
            font-size: 18px;
        }

        canvas {
            max-width: 100%;
            display: block;
            background: #eee;
        }

        .info {
            padding: 16px 24px;
            background: #111;
            font-family: monospace;
            white-space: pre-wrap;
        }

        #resultCanvas {
            image-rendering: pixelated;
            width: 100%;
        }
    </style>
</head>

<body>

    <header>
        <h1>像素图自动规范化</h1>
    </header>

    <div class="controls">

        <label>
            上传图片
            <input type="file" id="fileInput" accept="image/*">
        </label>
<label>
    采样方式

    <select id="sampleMode">

        <option value="center">
            中心点
        </option>

        <option value="mean">
            算术平均
        </option>

        <option value="median">
            中位数
        </option>

        <option value="geometric">
            几何平均
        </option>

        <option value="mode">
            众数
        </option>

    </select>
</label>

        <button id="analyzeBtn">重新分析</button>

        <span id="status">等待图片</span>

    </div>

    <div class="info" id="info"></div>

    <div class="grid">

        <div class="panel">
            <h2>X 自相关</h2>
            <canvas id="acX"></canvas>
        </div>

        <div class="panel">
            <h2>Y 自相关</h2>
            <canvas id="acY"></canvas>
        </div>

        <div class="panel">
            <h2>检测网格</h2>
            <canvas id="gridCanvas"></canvas>
        </div>

        <div class="panel">
            <h2>规范化结果</h2>
            <canvas id="resultCanvas"></canvas>
        </div>

    </div>

    <script>

        /* ============================================================
           工具
        ============================================================ */

        function clamp(x, a, b) {
            return Math.max(a, Math.min(b, x));
        }

        function median(arr) {

            if (!arr.length) return 0;

            const a = [...arr].sort((x, y) => x - y);

            const m = Math.floor(a.length / 2);

            if (a.length % 2)
                return a[m];

            return (a[m - 1] + a[m]) / 2;
        }


        /* ============================================================
           FFT
        ============================================================ */

        function nextPow2(n) {

            let p = 1;

            while (p < n)
                p <<= 1;

            return p;
        }


        function fft(re, im, inverse = false) {

            const n = re.length;

            let j = 0;

            for (let i = 1; i < n; i++) {

                let bit = n >> 1;

                while (j & bit) {
                    j ^= bit;
                    bit >>= 1;
                }

                j ^= bit;

                if (i < j) {

                    [re[i], re[j]] = [re[j], re[i]];
                    [im[i], im[j]] = [im[j], im[i]];
                }
            }

            for (let len = 2; len <= n; len <<= 1) {

                const angle =
                    2 * Math.PI / len *
                    (inverse ? 1 : -1);

                const wlenRe = Math.cos(angle);
                const wlenIm = Math.sin(angle);

                for (let i = 0; i < n; i += len) {

                    let wRe = 1;
                    let wIm = 0;

                    const half = len >> 1;

                    for (let j = 0; j < half; j++) {

                        const uRe = re[i + j];
                        const uIm = im[i + j];

                        const vRe =
                            re[i + j + half] * wRe -
                            im[i + j + half] * wIm;

                        const vIm =
                            re[i + j + half] * wIm +
                            im[i + j + half] * wRe;

                        re[i + j] = uRe + vRe;
                        im[i + j] = uIm + vIm;

                        re[i + j + half] = uRe - vRe;
                        im[i + j + half] = uIm - vIm;

                        const nwRe =
                            wRe * wlenRe -
                            wIm * wlenIm;

                        const nwIm =
                            wRe * wlenIm +
                            wIm * wlenRe;

                        wRe = nwRe;
                        wIm = nwIm;
                    }
                }
            }

            if (inverse) {

                for (let i = 0; i < n; i++) {
                    re[i] /= n;
                    im[i] /= n;
                }
            }
        }


        /* ============================================================
           FFT 自相关
        
           autocorr(x) = IFFT(|FFT(x)|²)
        ============================================================ */

        function autocorrelation(signal) {

            const n = signal.length;

            const size = nextPow2(n * 2);

            const re = new Float64Array(size);
            const im = new Float64Array(size);

            /*
               先减去均值。
        
               否则 DC 会压制周期性结构。
            */

            let mean = 0;

            for (const x of signal)
                mean += x;

            mean /= n;

            for (let i = 0; i < n; i++)
                re[i] = signal[i] - mean;

            fft(re, im);

            /*
               功率谱
            */

            for (let i = 0; i < size; i++) {

                const power =
                    re[i] * re[i] +
                    im[i] * im[i];

                re[i] = power;
                im[i] = 0;
            }

            fft(re, im, true);

            const result = new Float64Array(n);

            /*
               overlap normalization
        
               lag 越大，参与比较的样本越少。
            */

            const zero = re[0] || 1e-9;

            for (let lag = 0; lag < n; lag++) {

                const overlap = n - lag;

                result[lag] =
                    re[lag] / overlap;

                result[lag] /=
                    zero / n;
            }

            return result;
        }


        /* ============================================================
           图像边缘
        ============================================================ */

        function makeEdgeMap(imgData) {

            const { width, height, data } = imgData;

            const gray =
                new Float32Array(width * height);

            /*
               灰度
            */

            for (let i = 0; i < width * height; i++) {

                const p = i * 4;

                gray[i] =
                    data[p] * 0.2126 +
                    data[p + 1] * 0.7152 +
                    data[p + 2] * 0.0722;
            }

            const edge =
                new Float32Array(width * height);

            /*
               简单梯度。
        
               这里故意不使用复杂 Canny，
               因为目标不是物体轮廓，
               而是像素格的周期性边界。
            */

            for (let y = 1; y < height - 1; y++) {

                for (let x = 1; x < width - 1; x++) {

                    const i = y * width + x;

                    const gx =
                        Math.abs(
                            gray[i + 1] -
                            gray[i - 1]
                        );

                    const gy =
                        Math.abs(
                            gray[i + width] -
                            gray[i - width]
                        );

                    edge[i] = gx + gy;
                }
            }

            return {
                gray,
                edge,
                width,
                height
            };
        }


        /* ============================================================
           投影
        
           X 周期：
           垂直边缘强度沿 Y 汇总
        
           Y 周期：
           水平边缘强度沿 X 汇总
        ============================================================ */

        function buildProjections(gray, width, height) {

            const px = new Float64Array(width);
            const py = new Float64Array(height);

            /*
               使用 RGB/亮度差构建方向投影，
               比直接使用整个 edge map 更稳定。
            */

            for (let y = 0; y < height; y++) {

                for (let x = 1; x < width; x++) {

                    const a =
                        gray[y * width + x];

                    const b =
                        gray[y * width + x - 1];

                    px[x] += Math.abs(a - b);
                }
            }

            for (let y = 1; y < height; y++) {

                for (let x = 0; x < width; x++) {

                    const a =
                        gray[y * width + x];

                    const b =
                        gray[(y - 1) * width + x];

                    py[y] += Math.abs(a - b);
                }
            }

            return { px, py };
        }


        /* ============================================================
           平滑
        ============================================================ */

        function smooth(arr, radius = 2) {

            const out =
                new Float64Array(arr.length);

            for (let i = 0; i < arr.length; i++) {

                let sum = 0;
                let count = 0;

                for (
                    let j = Math.max(0, i - radius);
                    j <= Math.min(arr.length - 1, i + radius);
                    j++
                ) {

                    sum += arr[j];
                    count++;
                }

                out[i] = sum / count;
            }

            return out;
        }


        /* ============================================================
           自相关峰检测
        
           重点：
        
           不再根据某个 period 的倍数位置累加峰值。
        
           这里只做一件事：
        
           找到实际存在的 peak train。
        ============================================================ */

        function findPeaks(ac) {

            const peaks = [];

            /*
               只分析前半段。
        
               后面 overlap 太少，
               自相关可靠性会下降。
            */

            const maxLag =
                Math.floor(ac.length * 0.55);

            /*
               robust baseline
            */

            const region =
                Array.from(ac.slice(1, maxLag));

            const base = median(region);

            const deviations =
                region.map(x => Math.abs(x - base));

            const mad =
                median(deviations) + 1e-9;

            /*
               比较宽松。
        
               后面由 lattice fitting 负责判断。
            */

            const threshold =
                base + mad * 0.8;

            for (let i = 2; i < maxLag - 2; i++) {

                if (
                    ac[i] > threshold &&
                    ac[i] >= ac[i - 1] &&
                    ac[i] > ac[i + 1]
                ) {

                    /*
                       非极大值抑制。
        
                       只合并非常接近的重复小峰。
                    */

                    if (
                        !peaks.length ||
                        i - peaks[peaks.length - 1].pos > 2
                    ) {

                        peaks.push({
                            pos: i,
                            value: ac[i]
                        });

                    } else if (
                        ac[i] >
                        peaks[peaks.length - 1].value
                    ) {

                        peaks[peaks.length - 1] = {
                            pos: i,
                            value: ac[i]
                        };
                    }
                }
            }

            return peaks;
        }


        /* ============================================================
           生成候选基频
        
           对相邻峰距离：
        
               Δ
               Δ / 2
               Δ / 3
        
           全部加入候选。
        
           因为可能漏掉一个峰：
        
               P
               2P
               P
        
           此时中间差距会变成 2P。
        ============================================================ */

        function generatePeriodCandidates(peaks) {

            const candidates = [];

            const maxPeriod = 256;
            const minPeriod = 2;

            for (let i = 1; i < peaks.length; i++) {

                const d =
                    peaks[i].pos -
                    peaks[i - 1].pos;

                for (let k = 1; k <= 4; k++) {

                    const p = d / k;

                    if (
                        p >= minPeriod &&
                        p <= maxPeriod
                    ) {
                        candidates.push(p);
                    }
                }
            }

            /*
               聚类，避免大量相近 candidate
            */

            candidates.sort((a, b) => a - b);

            const groups = [];

            for (const c of candidates) {

                let found = false;

                for (const g of groups) {

                    if (Math.abs(c - g.mean) < 1.5) {

                        g.values.push(c);

                        g.mean =
                            g.values.reduce(
                                (a, b) => a + b,
                                0
                            ) / g.values.length;

                        found = true;
                        break;
                    }
                }

                if (!found) {

                    groups.push({
                        mean: c,
                        values: [c]
                    });
                }
            }

            return groups
                .filter(g => g.values.length >= 2)
                .map(g => g.mean);
        }


        /* ============================================================
           Peak lattice fitting
        
           peak ≈ k × P
        
           评分重点：
        
           1. 有多少峰能对齐
           2. 对齐误差
           3. harmonic 是否连续
           4. 是否存在大量空的 harmonic bin
        
           这就是防止：
        
               50
               100
               150
        
           把真正：
        
               25
               50
               75
               100
               125
               150
        
           错误压成 2P。
        ============================================================ */

        function scorePeriod(peaks, period) {

            if (peaks.length < 3)
                return null;

            const tolerance =
                Math.max(1.5, period * 0.12);

            let matched = 0;

            const errors = [];

            const bins = new Set();

            let minK = Infinity;
            let maxK = -Infinity;

            for (const peak of peaks) {

                const k =
                    Math.round(peak.pos / period);

                if (k < 1)
                    continue;

                const target =
                    k * period;

                const error =
                    Math.abs(peak.pos - target);

                if (error <= tolerance) {

                    matched++;

                    errors.push(error / tolerance);

                    bins.add(k);

                    minK = Math.min(minK, k);
                    maxK = Math.max(maxK, k);
                }
            }

            if (matched < 3)
                return null;

            const coverage =
                matched / peaks.length;

            const medianError =
                median(errors);

            /*
               harmonic occupancy
        
               真正基频：
        
               1 2 3 4 5 6
        
               错误半频：
        
               2 4 6 8 10
        
               occupancy 明显下降
            */

            const span =
                maxK - minK + 1;

            const occupancy =
                bins.size / span;

            /*
               gap penalty
        
               计算连续整数 harmonic
               中缺了多少。
            */

            let gaps = 0;

            for (let k = minK; k <= maxK; k++) {

                if (!bins.has(k))
                    gaps++;
            }

            const gapPenalty =
                gaps / Math.max(1, span);

            /*
               最重要：
        
               我们偏好“能解释全部峰的最小周期”，
        
               但不能无限偏向极小周期。
        
               所以主要依靠：
               coverage
               occupancy
               alignment
        
               而不是直接奖励 harmonic 强度。
            */

            const score =
                coverage * 4 +
                occupancy * 4 +
                (1 - medianError) * 2 -
                gapPenalty * 2;

            return {
                period,
                score,
                coverage,
                occupancy,
                medianError,
                matched,
                bins: [...bins].sort((a, b) => a - b)
            };
        }


        /* ============================================================
           寻找基频
        ============================================================ */

        function detectPeriod(ac) {

            const peaks =
                findPeaks(ac);

            const candidates =
                generatePeriodCandidates(peaks);

            const scored = [];

            for (const p of candidates) {

                /*
                   局部 refinement。
        
                   不局限于整数像素。
                */

                let best = null;

                for (
                    let q = p - 1.5;
                    q <= p + 1.5;
                    q += 0.25
                ) {

                    if (q < 2)
                        continue;

                    const result =
                        scorePeriod(peaks, q);

                    if (
                        result &&
                        (!best ||
                            result.score > best.score)
                    ) {
                        best = result;
                    }
                }

                if (best)
                    scored.push(best);
            }

            if (!scored.length) {

                return {
                    period: null,
                    peaks,
                    scored
                };
            }

            /*
               排序
            */

            scored.sort(
                (a, b) => b.score - a.score
            );

            /*
               防止直接选择更大的倍频。
        
               如果：
        
               大周期 ≈ 小周期 × 整数
        
               且小周期的 coverage / occupancy
               并没有明显更差，
        
               优先小周期。
            */

            let winner =
                scored[0];

            for (const candidate of scored) {

                if (
                    candidate.period >=
                    winner.period
                ) continue;

                const ratio =
                    winner.period /
                    candidate.period;

                const integerRatio =
                    Math.round(ratio);

                if (
                    integerRatio >= 2 &&
                    Math.abs(
                        ratio - integerRatio
                    ) < 0.12
                ) {

                    /*
                       如果小周期几乎同样能解释峰列，
                       优先最小周期。
                    */

                    if (
                        candidate.coverage >=
                        winner.coverage - 0.08 &&

                        candidate.occupancy >=
                        winner.occupancy - 0.10
                    ) {

                        winner = candidate;
                    }
                }
            }

            return {
                period: winner.period,
                peaks,
                scored,
                winner
            };
        }


        /* ============================================================
           Phase alignment
        
           已知周期 P。
        
           在：
        
               phase ∈ [0, P)
        
           搜索边界位置。
        
           如果网格边界：
        
               phase
               phase + P
               phase + 2P
        
           应该经过大量像素边缘。
        
           所以直接在原图边缘投影上搜索。
        ============================================================ */

        function findPhase(projection, period) {

            let bestPhase = 0;
            let bestScore = -Infinity;

            const steps =
                Math.max(8, Math.round(period * 8));

            for (let s = 0; s < steps; s++) {

                const phase =
                    s / steps * period;

                let score = 0;
                let count = 0;

                /*
                   所有网格边界
                */

                for (
                    let x = phase;
                    x < projection.length;
                    x += period
                ) {

                    const center =
                        Math.round(x);

                    /*
                       对 ±1 像素取最大，
                       避免亚像素 period 造成误差。
                    */

                    let local = 0;

                    for (
                        let dx = -1;
                        dx <= 1;
                        dx++
                    ) {

                        const p = center + dx;

                        if (
                            p >= 0 &&
                            p < projection.length
                        ) {
                            local =
                                Math.max(
                                    local,
                                    projection[p]
                                );
                        }
                    }

                    score += local;
                    count++;
                }

                if (count)
                    score /= count;

                if (score > bestScore) {

                    bestScore = score;
                    bestPhase = phase;
                }
            }

            return bestPhase;
        }


        /* ============================================================
           像素采样
        ============================================================ */

        function sampleColor(
    samples,
    mode
) {

    if (!samples.length) {

        return [
            0,
            0,
            0,
            255
        ];
    }


    /*
        中心点模式不在这里处理，
        因为它根本不需要收集整个格子。
    */

    const rs = [];
    const gs = [];
    const bs = [];
    const as = [];

    for (const color of samples) {

        rs.push(color[0]);
        gs.push(color[1]);
        bs.push(color[2]);
        as.push(color[3]);
    }


    if (mode === "mean") {

        return [

            arithmeticMean(rs),

            arithmeticMean(gs),

            arithmeticMean(bs),

            arithmeticMean(as)
        ];
    }


    if (mode === "median") {

        return [

            medianValue(rs),

            medianValue(gs),

            medianValue(bs),

            medianValue(as)
        ];
    }


    if (mode === "geometric") {

        return [

            geometricMean(rs),

            geometricMean(gs),

            geometricMean(bs),

            arithmeticMean(as)
        ];
    }


    if (mode === "mode") {

        return modeColor(samples);
    }


    /*
        fallback
    */

    return [

        arithmeticMean(rs),

        arithmeticMean(gs),

        arithmeticMean(bs),

        arithmeticMean(as)
    ];
}

       function sampleImage(
    source,
    width,
    height,
    periodX,
    periodY,
    phaseX,
    phaseY,
    mode
) {

    const minCellX =
        Math.floor(
            -phaseX / periodX
        );

    const maxCellX =
        Math.ceil(
            (width - phaseX) /
            periodX
        );

    const minCellY =
        Math.floor(
            -phaseY / periodY
        );

    const maxCellY =
        Math.ceil(
            (height - phaseY) /
            periodY
        );


    const cols =
        maxCellX - minCellX;

    const rows =
        maxCellY - minCellY;


    const out =
        new ImageData(
            cols,
            rows
        );


    for (let gy = 0; gy < rows; gy++) {

        for (let gx = 0; gx < cols; gx++) {

            const cellX =
                gx + minCellX;

            const cellY =
                gy + minCellY;


            const left =
                phaseX +
                cellX * periodX;

            const right =
                phaseX +
                (cellX + 1) *
                periodX;

            const top =
                phaseY +
                cellY * periodY;

            const bottom =
                phaseY +
                (cellY + 1) *
                periodY;


            let color;


            /*
                中心点采样
            */

            if (mode === "center") {

                const x =
                    clamp(
                        Math.floor(
                            (
                                left +
                                right
                            ) / 2
                        ),
                        0,
                        width - 1
                    );

                const y =
                    clamp(
                        Math.floor(
                            (
                                top +
                                bottom
                            ) / 2
                        ),
                        0,
                        height - 1
                    );


                const p =
                    (
                        y * width +
                        x
                    ) * 4;


                color = [

                    source[p],

                    source[p + 1],

                    source[p + 2],

                    source[p + 3]
                ];

            } else {

                /*
                    整个格子的所有像素。

                    没有 margin。
                    没有 trim。
                    没有丢弃任何颜色。
                */

                const x0 =
                    Math.max(
                        0,
                        Math.ceil(left)
                    );

                const x1 =
                    Math.min(
                        width,
                        Math.ceil(right)
                    );

                const y0 =
                    Math.max(
                        0,
                        Math.ceil(top)
                    );

                const y1 =
                    Math.min(
                        height,
                        Math.ceil(bottom)
                    );


                const samples = [];


                for (
                    let y = y0;
                    y < y1;
                    y++
                ) {

                    for (
                        let x = x0;
                        x < x1;
                        x++
                    ) {

                        const p =
                            (
                                y * width +
                                x
                            ) * 4;


                        samples.push([

                            source[p],

                            source[p + 1],

                            source[p + 2],

                            source[p + 3]
                        ]);
                    }
                }


                color =
                    sampleColor(
                        samples,
                        mode
                    );
            }


            const outP =
                (
                    gy * cols +
                    gx
                ) * 4;


            out.data[outP] =
                clamp(
                    Math.round(
                        color[0]
                    ),
                    0,
                    255
                );

            out.data[outP + 1] =
                clamp(
                    Math.round(
                        color[1]
                    ),
                    0,
                    255
                );

            out.data[outP + 2] =
                clamp(
                    Math.round(
                        color[2]
                    ),
                    0,
                    255
                );

            out.data[outP + 3] =
                clamp(
                    Math.round(
                        color[3]
                    ),
                    0,
                    255
                );
        }
    }


    return {

        imageData: out,

        cols,

        rows
    };
}function arithmeticMean(values) {

    if (!values.length)
        return 0;

    let sum = 0;

    for (const value of values)
        sum += value;

    return sum / values.length;
}


function medianValue(values) {

    if (!values.length)
        return 0;

    const sorted =
        [...values].sort(
            (a, b) => a - b
        );

    const mid =
        Math.floor(
            sorted.length / 2
        );

    if (sorted.length % 2)
        return sorted[mid];

    return (
        sorted[mid - 1] +
        sorted[mid]
    ) / 2;
}


/*
    几何平均。

    RGB 中可能出现 0。

    因此使用：

    log((value + 1) / 256)

    最后再转换回来。

    +1 只是为了避免 log(0)，
    不是删除任何样本。
*/

function geometricMean(values) {

    if (!values.length)
        return 0;

    let logSum = 0;

    for (const value of values) {

        const normalized =
            (value + 1) / 256;

        logSum +=
            Math.log(normalized);
    }

    const meanLog =
        logSum / values.length;

    const result =
        Math.exp(meanLog) *
        256 - 1;

    return clamp(
        result,
        0,
        255
    );
}

function modeColor(
    samples,
    quantization = 16
) {

    if (!samples.length) {

        return [
            0,
            0,
            0,
            255
        ];
    }

    /*
        Map:

        quantized RGB
        ↓
        出现次数
        + 原始颜色和

        注意：

        所有像素都参与。

        没有 trim。
        没有 discard。
    */

    const buckets =
        new Map();

    for (const color of samples) {

        const qr =
            Math.floor(
                color[0] / quantization
            );

        const qg =
            Math.floor(
                color[1] / quantization
            );

        const qb =
            Math.floor(
                color[2] / quantization
            );

        const key =
            `${qr},${qg},${qb}`;

        let bucket =
            buckets.get(key);

        if (!bucket) {

            bucket = {

                count: 0,

                rSum: 0,
                gSum: 0,
                bSum: 0,
                aSum: 0
            };

            buckets.set(
                key,
                bucket
            );
        }

        bucket.count++;

        bucket.rSum += color[0];
        bucket.gSum += color[1];
        bucket.bSum += color[2];
        bucket.aSum += color[3];
    }

    /*
        找出现次数最多的颜色区域。
    */

    let winner = null;

    for (
        const bucket
        of buckets.values()
    ) {

        if (
            !winner ||
            bucket.count >
            winner.count
        ) {

            winner = bucket;
        }
    }

    return [

        winner.rSum /
        winner.count,

        winner.gSum /
        winner.count,

        winner.bSum /
        winner.count,

        winner.aSum /
        winner.count
    ];
}


        /* ============================================================
           Canvas 绘图
        ============================================================ */

        function drawCurve(canvas, data, peaks = []) {

            const width = 700;
            const height = 220;

            canvas.width = width;
            canvas.height = height;

            const ctx =
                canvas.getContext("2d");

            ctx.fillStyle = "#111";
            ctx.fillRect(
                0, 0,
                width, height
            );

            let max = -Infinity;
            let min = Infinity;

            for (const v of data) {
                max = Math.max(max, v);
                min = Math.min(min, v);
            }

            const range =
                max - min || 1;

            ctx.strokeStyle = "#ddd";
            ctx.lineWidth = 1;

            ctx.beginPath();

            for (let i = 0; i < data.length; i++) {

                const x =
                    i /
                    (data.length - 1) *
                    width;

                const y =
                    height -
                    10 -
                    (data[i] - min) /
                    range *
                    (height - 20);

                if (i === 0)
                    ctx.moveTo(x, y);
                else
                    ctx.lineTo(x, y);
            }

            ctx.stroke();

            /*
               标记检测到的 peaks
            */

            ctx.strokeStyle =
                "rgba(255,100,100,0.5)";

            for (const peak of peaks) {

                const x =
                    peak.pos /
                    (data.length - 1) *
                    width;

                ctx.beginPath();
                ctx.moveTo(x, height);
                ctx.lineTo(x, 0);
                ctx.stroke();
            }
        }


        function drawGrid(
            canvas,
            image,
            width,
            height,
            periodX,
            periodY,
            phaseX,
            phaseY
        ) {

            canvas.width = width;
            canvas.height = height;

            const ctx =
                canvas.getContext("2d");

            ctx.putImageData(image, 0, 0);

            ctx.strokeStyle =
                "rgba(0,220,255,0.7)";

            ctx.lineWidth = 1;

            ctx.beginPath();

            for (
                let x = phaseX;
                x < width;
                x += periodX
            ) {

                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
            }

            for (
                let x = phaseX - periodX;
                x >= 0;
                x -= periodX
            ) {

                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
            }

            for (
                let y = phaseY;
                y < height;
                y += periodY
            ) {

                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
            }

            for (
                let y = phaseY - periodY;
                y >= 0;
                y -= periodY
            ) {

                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
            }

            ctx.stroke();
        }


        /* ============================================================
           主程序
        ============================================================ */

        let sourceImage = null;


        document
            .getElementById("fileInput")
            .addEventListener("change", e => {

                const file = e.target.files[0];

                if (!file)
                    return;

                const img = new Image();

                img.onload = () => {

                    const canvas =
                        document.createElement("canvas");

                    canvas.width = img.width;
                    canvas.height = img.height;

                    const ctx =
                        canvas.getContext("2d");

                    ctx.drawImage(img, 0, 0);

                    sourceImage =
                        ctx.getImageData(
                            0,
                            0,
                            img.width,
                            img.height
                        );

                    analyze();
                };

                img.src =
                    URL.createObjectURL(file);
            });


        document
            .getElementById("analyzeBtn")
            .addEventListener("click", analyze);


        function analyze() {

            if (!sourceImage)
                return;

            const status =
                document.getElementById("status");

            status.textContent =
                "正在分析...";

            /*
               让浏览器先刷新 UI
            */

            setTimeout(() => {

                const {
                    width,
                    height
                } = sourceImage;

                const {
                    gray
                } =
                    makeEdgeMap(sourceImage);

                const {
                    px,
                    py
                } =
                    buildProjections(
                        gray,
                        width,
                        height
                    );

                /*
                   投影轻微平滑
                */

                const sx =
                    smooth(px, 1);

                const sy =
                    smooth(py, 1);

                const acX =
                    autocorrelation(sx);

                const acY =
                    autocorrelation(sy);

                const resultX =
                    detectPeriod(acX);

                const resultY =
                    detectPeriod(acY);

                if (
                    !resultX.period ||
                    !resultY.period
                ) {

                    status.textContent =
                        "未能可靠检测周期";

                    return;
                }

                const periodX =
                    resultX.period;

                const periodY =
                    resultY.period;

                /*
                   Phase alignment
                */

                const phaseX =
                    findPhase(
                        px,
                        periodX
                    );

                const phaseY =
                    findPhase(
                        py,
                        periodY
                    );

                drawCurve(
                    document.getElementById("acX"),
                    acX.slice(
                        0,
                        Math.floor(
                            acX.length * 0.55
                        )
                    ),
                    resultX.peaks
                );

                drawCurve(
                    document.getElementById("acY"),
                    acY.slice(
                        0,
                        Math.floor(
                            acY.length * 0.55
                        )
                    ),
                    resultY.peaks
                );

                drawGrid(
                    document.getElementById(
                        "gridCanvas"
                    ),
                    sourceImage,
                    width,
                    height,
                    periodX,
                    periodY,
                    phaseX,
                    phaseY
                );

                const mode =
                    document.getElementById(
                        "sampleMode"
                    ).value;

                const normalized =
                    sampleImage(
                        sourceImage.data,
                        width,
                        height,
                        periodX,
                        periodY,
                        phaseX,
                        phaseY,
                        mode
                    );

                const resultCanvas =
                    document.getElementById(
                        "resultCanvas"
                    );

                resultCanvas.width =
                    normalized.cols;

                resultCanvas.height =
                    normalized.rows;

                const resultCtx =
                    resultCanvas.getContext("2d");

                resultCtx.putImageData(
                    normalized.imageData,
                    0,
                    0
                );

                /*
                   放大预览，
                   但关闭平滑。
                */

                resultCtx.imageSmoothingEnabled =
                    false;

                document
                    .getElementById("info")
                    .textContent =

                    `X period: ${periodX.toFixed(2)} px
Y period: ${periodY.toFixed(2)} px

X phase: ${phaseX.toFixed(2)} px
Y phase: ${phaseY.toFixed(2)} px

Output:
${normalized.cols} × ${normalized.rows}

X score:
coverage   ${resultX.winner.coverage.toFixed(3)}
occupancy  ${resultX.winner.occupancy.toFixed(3)}
error      ${resultX.winner.medianError.toFixed(3)}

Y score:
coverage   ${resultY.winner.coverage.toFixed(3)}
occupancy  ${resultY.winner.occupancy.toFixed(3)}
error      ${resultY.winner.medianError.toFixed(3)}

X peaks:
${resultX.peaks.map(p => p.pos).join(", ")}

Y peaks:
${resultY.peaks.map(p => p.pos).join(", ")}`;

                status.textContent =
                    "分析完成";

            }, 20);
        }

    </script>
