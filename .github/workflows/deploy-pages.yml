name: Deploy to GitHub Pages

# main 有推送就重新构建发布；也可以手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个发布任务，新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 构建前先跑测试：算法 / CSS 层叠 / PWA 资源 / 运行时冒烟
      - name: 测试
        run: npm run test:all

      - name: 构建
        run: npm run build

      # 注意：不要加 enablement: true —— 用 workflow 的 GITHUB_TOKEN 去「创建」Pages 站点
      # 会被拒（Resource not accessible by integration）。仓库的 Pages 已经开好
      # （源 = GitHub Actions）；换新仓库时先在 Settings → Pages 里选一次 GitHub Actions，
      # 或者本地执行：gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
